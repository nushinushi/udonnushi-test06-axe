    <script>
      (function () {
        var langs = ['ja', 'en', 'ko'];
        var stored = null;
        try {
          stored = localStorage.getItem('ui-lang');
        } catch (e) {}
        var nav = (navigator.language || '').toLowerCase();
        var lang =
          langs.indexOf(stored) >= 0 ? stored : nav.indexOf('ja') === 0 ? 'ja' : nav.indexOf('ko') === 0 ? 'ko' : 'en';
        // The build writes the app's version in, as the app asks for the file under it. The
        // development server leaves the mark as it is, so nothing is asked ahead for there.
        var version = '1.77.2';
        if (/^__/.test(version)) return;
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'fetch';
        link.crossOrigin = 'anonymous';
        link.href = 'assets/i18n/' + lang + '.json?v=' + version;
        document.head.appendChild(link);
      })();
    </script>
    <!-- Keeps the wrong theme from flashing: applies data-theme before Angular starts -->
    <script>
      (function () {
        var t = localStorage.getItem('ui-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
        // A screen laid over a stream has to be see-through already, from the loading display on.
        if (/^#join\?/.test(location.hash) && /[?&]overlay=1(&|$)/.test(location.hash))
          document.documentElement.setAttribute('data-overlay', '1');

    <style>
      html[data-overlay] #app-loading {
        display: none;
      }

      /* The screen shown while the app and its table load, loud on purpose: a sweet-shop sky under the
         title and its motto, a little System-chan rocking slowly over her shadow, a candy-striped bar
         that fills as each stage is reached, and a line saying which. It lets every press through, and
         goes once the table is drawn. Its look is kept here, with it, rather than in the app's
         stylesheet: it is needed before that sheet arrives, and nowhere after it is gone. */
      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(10px, 2.2vh, 18px);
        overflow: hidden;
        pointer-events: none;
        background:
          radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.35) 0 2px, transparent 3px) 0 0 / 34px 34px,
          linear-gradient(120deg, #ff4fb8, #9b5cff, #27d4ff, #ffe14d, #ff4fb8);
        background-size:
          34px 34px,
          400% 400%;
        animation: app-loading-sky 9s ease-in-out infinite;
        transition: opacity 0.45s ease;
      }

      #app-loading.is-done {
        opacity: 0;
      }

      #app-loading .app-loading-sparkles i {
        position: absolute;
        font-style: normal;
        color: #fff;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
        animation: app-loading-twinkle 1.8s ease-in-out infinite;
      }

      #app-loading .app-loading-sparkles i:nth-child(1) {
        left: 8%;
        top: 14%;
        font-size: 26px;
        animation-delay: 0s;
      }
      #app-loading .app-loading-sparkles i:nth-child(2) {
        left: 22%;
        top: 72%;
        font-size: 18px;
        animation-delay: 0.4s;
        color: #fff6a8;
      }
      #app-loading .app-loading-sparkles i:nth-child(3) {
        left: 84%;
        top: 18%;
        font-size: 30px;
        animation-delay: 0.8s;
      }
      #app-loading .app-loading-sparkles i:nth-child(4) {
        left: 90%;
        top: 64%;
        font-size: 22px;
        animation-delay: 0.2s;
        color: #ffd1f0;
      }
      #app-loading .app-loading-sparkles i:nth-child(5) {
        left: 14%;
        top: 44%;
        font-size: 16px;
        animation-delay: 1.1s;
      }
      #app-loading .app-loading-sparkles i:nth-child(6) {
        left: 70%;
        top: 84%;
        font-size: 24px;
        animation-delay: 0.6s;
        color: #fff6a8;
      }
      #app-loading .app-loading-sparkles i:nth-child(7) {
        left: 34%;
        top: 10%;
        font-size: 14px;
        animation-delay: 1.4s;
      }
      #app-loading .app-loading-sparkles i:nth-child(8) {
        left: 6%;
        top: 86%;
        font-size: 20px;
        animation-delay: 0.9s;
        color: #ffd1f0;
      }
      #app-loading .app-loading-sparkles i:nth-child(9) {
        left: 62%;
        top: 8%;
        font-size: 18px;
        animation-delay: 0.3s;
      }
      #app-loading .app-loading-sparkles i:nth-child(10) {
        left: 94%;
        top: 40%;
        font-size: 16px;
        animation-delay: 1.6s;
        color: #fff6a8;
      }
      #app-loading .app-loading-sparkles i:nth-child(11) {
        left: 44%;
        top: 90%;
        font-size: 22px;
        animation-delay: 1.2s;
      }
      #app-loading .app-loading-sparkles i:nth-child(12) {
        left: 78%;
        top: 52%;
        font-size: 14px;
        animation-delay: 0.7s;
        color: #ffd1f0;
      }

      #app-loading .app-loading-logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        color: #fff;
        text-shadow: 0 2px 6px rgba(42, 23, 69, 0.45);
      }

      #app-loading .app-loading-title {
        font-size: clamp(30px, 5.5vw, 52px);
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }

      #app-loading .app-loading-subtitle {
        font-size: clamp(11px, 1.6vw, 14px);
        font-weight: 500;
        letter-spacing: 0.2em;
        opacity: 0.92;
      }

      #app-loading .app-loading-subtitle b {
        font-weight: 800;
      }

      #app-loading .app-loading-stagearea {
        position: relative;
        display: flex;
        justify-content: center;
      }

      #app-loading .app-loading-chara {
        position: relative;
        width: clamp(180px, 34vw, 300px);
        height: auto;
        filter: drop-shadow(0 3px 0 rgba(42, 23, 69, 0.35));
        transform-origin: 50% 220%;
        animation: app-loading-rock 4s ease-in-out infinite;
      }

      #app-loading .app-loading-shadow {
        position: absolute;
        bottom: -6px;
        left: 50%;
        width: 70%;
        height: 16px;
        border-radius: 50%;
        background: rgba(42, 23, 69, 0.28);
        transform: translateX(-50%);
      }

      #app-loading .app-loading-meter {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      #app-loading .app-loading-bar {
        position: relative;
        width: min(340px, 64vw);
        height: 20px;
        overflow: hidden;
        border: 3px solid #fff;
        border-radius: 999px;
        background: rgba(42, 23, 69, 0.35);
        box-shadow:
          0 0 0 3px #2a1745,
          0 6px 0 rgba(42, 23, 69, 0.45);
      }

      #app-loading .app-loading-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 8%;
        border-radius: inherit;
        background:
          repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.45) 0 8px, transparent 8px 16px) 0 0 / 23px 23px,
          linear-gradient(90deg, #ff3fa4, #ffb21a, #57e13b, #19c3ff, #9a4dff);
        animation: app-loading-stripes 0.6s linear infinite;
        transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      #app-loading .app-loading-percent {
        min-width: 3.2em;
        padding: 2px 8px;
        border: 3px solid #2a1745;
        border-radius: 999px;
        background: #fff;
        color: #ff3fa4;
        font-size: 15px;
        font-weight: 900;
        text-align: center;
        font-variant-numeric: tabular-nums;
        transform: rotate(-6deg);
      }

      #app-loading .app-loading-stage {
        min-height: 1.5em;
        padding: 4px 16px;
        border-radius: 999px;
        background: #2a1745;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.04em;
        box-shadow: 0 0 0 3px #fff;
      }

      @media (prefers-reduced-motion: reduce) {
        #app-loading,
        #app-loading .app-loading-sparkles i,
        #app-loading .app-loading-chara,
        #app-loading .app-loading-fill {
          animation: none;
        }
      }

      @keyframes app-loading-sky {
        0%,
        100% {
          background-position:
            0 0,
            0% 50%;
        }

        50% {
          background-position:
            17px 17px,
            100% 50%;
        }
      }

      @keyframes app-loading-twinkle {
        0%,
        100% {
          opacity: 0.25;
          transform: scale(0.6) rotate(0deg);
        }

        50% {
          opacity: 1;
          transform: scale(1.15) rotate(20deg);
        }
      }

      @keyframes app-loading-rock {
        0%,
        100% {
          transform: rotate(-3deg);
        }

        50% {
          transform: rotate(3deg);
        }
      }

      @keyframes app-loading-stripes {
        0% {
          background-position:
            0 0,
            0 0;
        }

        100% {
          background-position:
            23px 0,
            0 0;
        }
      }
    </style>
